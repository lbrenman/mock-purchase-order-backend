openapi: 3.0.3
info:
  title: Supplier Master (SRM) API (mock)
  version: 1.0.0
  description: |
    Mock **Supplier Relationship Management / supplier master** backend. Owns the enterprise
    supplier identity (`SUP-100245`), ship-from sites, contacts, the **cross-reference to ERP
    vendor numbers**, and **consumer entitlements** used to enforce "which consumer may see or
    act for which supplier".

    Differences from the façade the iPaaS must handle:
    * Nested camelCase (`name.legal`, `classification.tier`, `address.postalCode`).
    * Offset pagination: `{ total, offset, limit, items }`.
    * Error dialect: `{ "errors": [ { "code", "message", "field?" } ], "traceId" }`.
    * Addresses use `address.line1/city/region/postalCode/countryCode`.

    **Demo headers** (when `CHAOS_ENABLED=true`): `x-mock-status`, `x-mock-delay-ms`.
servers:
  - url: /srm
security:
  - ApiKeyAuth: []
tags:
  - name: Suppliers
  - name: Sites
  - name: Contacts
  - name: Cross Reference
  - name: Entitlements
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check (no auth)
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: srm}
  /v1/suppliers:
    get:
      tags: [Suppliers]
      summary: Search suppliers
      operationId: listSuppliers
      parameters:
        - {name: status, in: query, description: 'ACTIVE, ON_HOLD, BLOCKED (comma separated)', schema: {type: string}}
        - {name: country, in: query, schema: {type: string, example: US}}
        - {name: tier, in: query, schema: {type: string, example: STRATEGIC}}
        - {name: supplierCode, in: query, description: Comma separated, schema: {type: string}}
        - {name: erpVendorNumber, in: query, description: Comma separated, schema: {type: string}}
        - {name: q, in: query, description: Name contains (case-insensitive), schema: {type: string}}
        - {name: expand, in: query, description: 'contacts,sites', schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Page of suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, example: 6}
                  offset: {type: integer, example: 0}
                  limit: {type: integer, example: 20}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Supplier'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Suppliers]
      summary: Create a supplier
      description: "`supplierCode` is optional (next free SUP- number). `erpVendorNumber` must be unique: it is the join key to ERP purchase orders."
      operationId: createSupplier
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierWrite'}
            example:
              erpVendorNumber: '0000710999'
              name: {legal: Demo Components LLC, trading: Demo Components}
              countryCode: US
              classification: {tier: APPROVED, riskRating: MEDIUM}
              capabilities: {portal: true, asn: true}
      responses:
        '201':
          description: Created supplier (with empty sites and contacts)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/suppliers/{supplierCode}:
    parameters:
      - $ref: '#/components/parameters/SupplierCode'
    get:
      tags: [Suppliers]
      summary: Get a supplier (contacts and sites included by default)
      operationId: getSupplier
      parameters:
        - {name: expand, in: query, description: 'Override embedded collections, e.g. `sites` or empty', schema: {type: string}}
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
              example:
                supplierCode: SUP-100245
                erpVendorNumber: '0000710245'
                name: {legal: 'Apex Precision Components, Inc.', trading: Apex Precision}
                status: ACTIVE
                statusReason: null
                classification: {tier: STRATEGIC, riskRating: LOW}
                capabilities: {portal: true, asn: true}
                countryCode: US
                duns: '081466849'
                onboardedOn: '2019-04-01'
                updatedAt: '2026-09-24T12:00:00.000Z'
                contacts:
                  - {contactId: CNT-0001, role: PRIMARY, name: Rachel Kim, email: rachel.kim@apex-precision.example.com, phone: '+1-404-555-0142'}
                sites:
                  - siteCode: SUP-ATL-01
                    supplierCode: SUP-100245
                    type: SHIP_FROM
                    name: Supplier Distribution Center
                    address: {line1: 4500 Fulton Industrial Blvd SW, city: Atlanta, region: GA, postalCode: '30301', countryCode: US}
                    active: true
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Suppliers]
      summary: Update supplier master data, status or capabilities
      description: Partial update. Setting `status` to `ACTIVE` without `statusReason` clears the reason. Putting a supplier ON_HOLD or BLOCKED is the demo control for governance failures.
      operationId: updateSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierWrite'}
            example:
              status: ON_HOLD
              statusReason: Quality escalation QE-2026-77
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Suppliers]
      summary: Delete a supplier with its sites and contacts
      description: Refused with 409 `SUPPLIER_HAS_ENTITLEMENTS` while an entitlement lists it. ERP purchase orders for its vendor number stop resolving (VENDOR_NOT_MAPPED).
      operationId: deleteSupplier
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/suppliers/{supplierCode}/sites:
    parameters:
      - $ref: '#/components/parameters/SupplierCode'
    get:
      tags: [Sites]
      summary: List a supplier's sites
      operationId: listSupplierSites
      parameters:
        - {name: type, in: query, description: 'SHIP_FROM, REMIT_TO, MANUFACTURING', schema: {type: string}}
        - {name: active, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Sites
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Site'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Sites]
      summary: Add a site to a supplier
      operationId: createSite
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteWrite'}
            example:
              siteCode: SUP-ATL-02
              type: SHIP_FROM
              name: Apex Savannah Crossdock
              address: {line1: 1 Port Way, city: Savannah, region: GA, postalCode: '31401', countryCode: US}
              active: true
      responses:
        '201':
          description: Created site
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Site'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/suppliers/{supplierCode}/contacts:
    parameters:
      - $ref: '#/components/parameters/SupplierCode'
    get:
      tags: [Suppliers]
      summary: List a supplier's contacts
      operationId: listSupplierContacts
      parameters:
        - {name: role, in: query, description: 'PRIMARY, LOGISTICS, QUALITY, FINANCE', schema: {type: string}}
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Contact'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Contacts]
      summary: Add a contact to a supplier (contactId assigned as CNT-nnnn)
      operationId: createContact
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactWrite'}
            example: {role: QUALITY, name: Dana Whitfield, email: quality@apex-precision.example.com, phone: +1-404-555-0190}
      responses:
        '201':
          description: Created contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactWithSupplier'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/sites:
    get:
      tags: [Sites]
      summary: List sites across all suppliers
      operationId: listSites
      parameters:
        - {name: supplierCode, in: query, description: Comma separated, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: [SHIP_FROM, REMIT_TO, MANUFACTURING]}}
        - {name: country, in: query, schema: {type: string}}
        - {name: active, in: query, schema: {type: boolean}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Sites
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  offset: {type: integer}
                  limit: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Site'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/sites/{siteCode}:
    get:
      tags: [Sites]
      summary: Get a site by code (validate an ASN ship-from)
      operationId: getSite
      parameters:
        - {name: siteCode, in: path, required: true, schema: {type: string, example: SUP-ATL-01}}
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Site'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Sites]
      summary: Change a site
      operationId: updateSite
      parameters:
        - {name: siteCode, in: path, required: true, schema: {type: string, example: SUP-ATL-01}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteWrite'}
            example: {active: false}
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Site'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Sites]
      summary: Delete a site
      operationId: deleteSite
      parameters:
        - {name: siteCode, in: path, required: true, schema: {type: string, example: SUP-ATL-02}}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/contacts:
    get:
      tags: [Contacts]
      summary: List contacts across all suppliers
      operationId: listContacts
      parameters:
        - {name: supplierCode, in: query, description: Comma separated, schema: {type: string}}
        - {name: role, in: query, schema: {type: string, enum: [PRIMARY, LOGISTICS, QUALITY, FINANCE]}}
        - {name: q, in: query, description: Name or email contains, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  offset: {type: integer}
                  limit: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ContactWithSupplier'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/contacts/{contactId}:
    parameters:
      - {name: contactId, in: path, required: true, schema: {type: string, example: CNT-0001}}
    get:
      tags: [Contacts]
      summary: Get a contact
      operationId: getContact
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactWithSupplier'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Contacts]
      summary: Change a contact
      operationId: updateContact
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContactWrite'}
            example: {phone: +1-404-555-0100}
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContactWithSupplier'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Contacts]
      summary: Delete a contact
      operationId: deleteContact
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/vendor-xref:
    get:
      tags: [Cross Reference]
      summary: Batch-resolve ERP vendor numbers <-> supplier codes
      description: Use this in list flows to translate many ERP `vendor_id`s in one call.
      operationId: resolveVendorXref
      parameters:
        - {name: erpVendorNumber, in: query, description: Comma separated, schema: {type: string, example: '0000710245,0000710311'}}
        - {name: supplierCode, in: query, description: Comma separated, schema: {type: string, example: SUP-100402}}
      responses:
        '200':
          description: Mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/VendorXref'}
                  unresolved:
                    type: array
                    items: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/vendor-xref/{erpVendorNumber}:
    get:
      tags: [Cross Reference]
      summary: Resolve one ERP vendor number
      operationId: getVendorXref
      parameters:
        - {name: erpVendorNumber, in: path, required: true, schema: {type: string, example: '0000710245'}}
      responses:
        '200':
          description: Mapping
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorXref'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/entitlements:
    get:
      tags: [Entitlements]
      summary: List registered API consumers and their entitlements
      operationId: listEntitlements
      parameters:
        - {name: active, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Entitlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Entitlement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Entitlements]
      summary: Register an API consumer and its entitlements
      description: "Use `allSuppliers: true` for a wildcard grant, otherwise list supplier codes in `suppliers`."
      operationId: createEntitlement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementWrite'}
            example:
              consumerId: demo-supplier-portal
              displayName: Demo Supplier Portal
              consumerType: supplier-partner
              suppliers: [SUP-100245, SUP-100311]
              scopes: [supplier-orders.read, supplier-orders.write]
              active: true
              costCenter: EXT-DEMO
              contactEmail: it@demo.example.com
      responses:
        '201':
          description: Created entitlement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entitlement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/entitlements/{consumerId}:
    get:
      tags: [Entitlements]
      summary: Get a consumer's entitlements
      operationId: getEntitlement
      parameters:
        - $ref: '#/components/parameters/ConsumerId'
      responses:
        '200':
          description: Entitlement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entitlement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Entitlements]
      summary: Change scopes, suppliers or activation
      description: Deactivating a consumer makes every check return allowed=false with reason CONSUMER_INACTIVE.
      operationId: updateEntitlement
      parameters:
        - $ref: '#/components/parameters/ConsumerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EntitlementWrite'}
            example: {active: false}
      responses:
        '200':
          description: Updated entitlement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Entitlement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Entitlements]
      summary: Remove an API consumer
      operationId: deleteEntitlement
      parameters:
        - $ref: '#/components/parameters/ConsumerId'
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/entitlements/{consumerId}/check:
    parameters:
      - $ref: '#/components/parameters/ConsumerId'
    get:
      tags: [Entitlements]
      summary: Authorization decision (query string form)
      operationId: checkEntitlementGet
      parameters:
        - {name: scope, in: query, required: true, schema: {type: string, enum: [supplier-orders.read, supplier-orders.write]}}
        - {name: supplierCode, in: query, schema: {type: string, example: SUP-100245}}
      responses:
        '200':
          description: Decision (allowed may be false)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementDecision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Entitlements]
      summary: Authorization decision
      description: |
        Always returns 200 with `allowed` and a `reason`:
        `OK`, `CONSUMER_INACTIVE`, `SCOPE_NOT_GRANTED`, `SUPPLIER_NOT_FOUND`,
        `SUPPLIER_SCOPE_DENIED`, `SUPPLIER_BLOCKED`, `SUPPLIER_ON_HOLD` (write scope only).
      operationId: checkEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: {type: string, enum: [supplier-orders.read, supplier-orders.write]}
                supplierCode: {type: string, pattern: '^SUP-[0-9]{6}$'}
            example:
              scope: supplier-orders.write
              supplierCode: SUP-100245
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementDecision'}
              example:
                consumerId: prc-edi-bridge
                consumerType: supplier-partner
                scope: supplier-orders.write
                supplierCode: SUP-100402
                allowed: false
                reason: SCOPE_NOT_GRANTED
                allowedSuppliers: [SUP-100402]
                evaluatedAt: '2026-09-24T12:00:00.000Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Default key `srm-demo-key` (set `SRM_API_KEY`). Disabled when `SRM_AUTH_MODE=none`.
  parameters:
    SupplierCode:
      name: supplierCode
      in: path
      required: true
      schema: {type: string, pattern: '^SUP-[0-9]{6}$', example: SUP-100245}
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: {type: string, example: apex-supplier-portal}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional. Same key + same body replays the original response.
      schema: {type: string, minLength: 8, maxLength: 128}
  schemas:
    Address:
      type: object
      properties:
        line1: {type: string, nullable: true}
        city: {type: string, nullable: true}
        region: {type: string, nullable: true}
        postalCode: {type: string, nullable: true}
        countryCode: {type: string}
    Site:
      type: object
      properties:
        siteCode: {type: string, example: SUP-ATL-01}
        supplierCode: {type: string, example: SUP-100245}
        type: {type: string, enum: [SHIP_FROM, REMIT_TO, MANUFACTURING]}
        name: {type: string}
        address: {$ref: '#/components/schemas/Address'}
        active: {type: boolean}
    Contact:
      type: object
      properties:
        contactId: {type: string}
        role: {type: string, enum: [PRIMARY, LOGISTICS, QUALITY, FINANCE]}
        name: {type: string}
        email: {type: string}
        phone: {type: string, nullable: true}
    Supplier:
      type: object
      properties:
        supplierCode: {type: string, example: SUP-100245}
        erpVendorNumber: {type: string, example: '0000710245'}
        name:
          type: object
          properties:
            legal: {type: string}
            trading: {type: string, nullable: true}
        status: {type: string, enum: [ACTIVE, ON_HOLD, BLOCKED]}
        statusReason: {type: string, nullable: true}
        classification:
          type: object
          properties:
            tier: {type: string, enum: [STRATEGIC, PREFERRED, APPROVED, CONDITIONAL]}
            riskRating: {type: string, enum: [LOW, MEDIUM, HIGH]}
        capabilities:
          type: object
          properties:
            portal: {type: boolean}
            asn: {type: boolean, description: Supplier may submit advance shipment notices}
        countryCode: {type: string}
        duns: {type: string, nullable: true}
        onboardedOn: {type: string, format: date, nullable: true}
        updatedAt: {type: string, format: date-time}
        contacts:
          type: array
          items: {$ref: '#/components/schemas/Contact'}
        sites:
          type: array
          items: {$ref: '#/components/schemas/Site'}
    SupplierWrite:
      type: object
      description: Create requires erpVendorNumber, name.legal and countryCode; every field is optional on PATCH.
      properties:
        supplierCode: {type: string, pattern: '^SUP-[0-9]{6}$', description: Create only}
        erpVendorNumber: {type: string, pattern: '^[0-9]{10}$'}
        name:
          type: object
          properties:
            legal: {type: string}
            trading: {type: string}
        status: {type: string, enum: [ACTIVE, ON_HOLD, BLOCKED]}
        statusReason: {type: string}
        classification:
          type: object
          properties:
            tier: {type: string, enum: [STRATEGIC, PREFERRED, APPROVED, CONDITIONAL]}
            riskRating: {type: string, enum: [LOW, MEDIUM, HIGH]}
        capabilities:
          type: object
          properties:
            portal: {type: boolean}
            asn: {type: boolean}
        countryCode: {type: string, pattern: '^[A-Z]{2}$'}
        duns: {type: string, pattern: '^[0-9]{9}$'}
        onboardedOn: {type: string, format: date}
    SiteWrite:
      type: object
      description: Create requires siteCode, type, name and address.countryCode.
      properties:
        siteCode: {type: string, description: Create only}
        type: {type: string, enum: [SHIP_FROM, REMIT_TO, MANUFACTURING]}
        name: {type: string}
        address: {$ref: '#/components/schemas/Address'}
        active: {type: boolean}
    ContactWrite:
      type: object
      description: Create requires role, name and email.
      properties:
        role: {type: string, enum: [PRIMARY, LOGISTICS, QUALITY, FINANCE]}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
    ContactWithSupplier:
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          properties:
            supplierCode: {type: string, example: SUP-100245}
    EntitlementWrite:
      type: object
      description: Create requires consumerId, displayName, consumerType, scopes and suppliers (or allSuppliers).
      properties:
        consumerId: {type: string, pattern: '^[a-z0-9][a-z0-9-]*$', description: Create only}
        displayName: {type: string}
        consumerType: {type: string, enum: [supplier-partner, internal-application, operations-support]}
        allSuppliers: {type: boolean}
        suppliers:
          type: array
          items: {type: string, pattern: '^SUP-[0-9]{6}$'}
        scopes:
          type: array
          items: {type: string, enum: [supplier-orders.read, supplier-orders.write]}
        active: {type: boolean}
        costCenter: {type: string}
        contactEmail: {type: string, format: email}
    VendorXref:
      type: object
      properties:
        supplierCode: {type: string, example: SUP-100245}
        erpVendorNumber: {type: string, example: '0000710245'}
        status: {type: string, example: ACTIVE}
        legalName: {type: string}
    Entitlement:
      type: object
      properties:
        consumerId: {type: string, example: apex-supplier-portal}
        displayName: {type: string}
        consumerType: {type: string, enum: [supplier-partner, internal-application, operations-support]}
        allSuppliers: {type: boolean}
        suppliers:
          type: array
          items: {type: string}
        scopes:
          type: array
          items: {type: string}
        active: {type: boolean}
        costCenter: {type: string, nullable: true}
        contactEmail: {type: string, nullable: true}
        updatedAt: {type: string, format: date-time}
    EntitlementDecision:
      type: object
      properties:
        consumerId: {type: string}
        consumerType: {type: string}
        scope: {type: string}
        supplierCode: {type: string, nullable: true}
        allowed: {type: boolean}
        reason: {type: string}
        allowedSuppliers:
          type: array
          items: {type: string}
        evaluatedAt: {type: string, format: date-time}
    SrmError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              message: {type: string}
              field: {type: string}
        traceId: {type: string}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SrmError'}
          example:
            errors:
              - {code: VALIDATION_FAILED, message: Request validation failed}
              - {code: FIELD_INVALID, field: scope, message: 'must be one of: supplier-orders.read, supplier-orders.write'}
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SrmError'}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SrmError'}
          example:
            errors: [{code: SUPPLIER_NOT_FOUND, message: Supplier SUP-999999 does not exist}]
    Conflict:
      description: Duplicate key or the record is still referenced
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SrmError'}
          example:
            errors: [{code: SUPPLIER_HAS_ENTITLEMENTS, message: 'Supplier is referenced by consumer entitlement(s): apex-supplier-portal. Remove it from those first.'}]
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SrmError'}
    ServiceUnavailable:
      description: Unavailable (or simulated)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SrmError'}
